name: Publish from manifest

# Manually-triggered rescue workflow that packs and pushes each component to
# NuGet at the version recorded in .release-please-manifest.json. Designed for
# the case where release-please created GitHub releases / tags but the publish
# job failed before pushing to NuGet (so manifest is ahead of the package feed).
# --skip-duplicate makes re-runs safe.
#
# Usage:  gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.Specification

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack each component at manifest version
        run: |
          mkdir -p ./artifacts
          # One component, so every package ships at the root manifest version. The previous
          # form walked the manifest keys and ran ls per key; with a single "." key that
          # resolves to the repository root, which holds no csproj, so it packed nothing.
          version=$(jq -r '."."' .release-please-manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::no root version in .release-please-manifest.json"
            exit 1
          fi

          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at version $version"
            # No --no-build, and -p:Version rather than -p:PackageVersion alone. The build
            # step above runs without a version, so packing must rebuild at the real one or
            # the assembly keeps a fallback while the package claims the right number.
            # See ZeroAlloc-Net/.github#26.
            dotnet pack "$csproj" --configuration Release \
              -p:PackageVersion="$version" -p:Version="$version" -o ./artifacts
          done
          ls -la ./artifacts

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/ZeroAlloc-Net/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
