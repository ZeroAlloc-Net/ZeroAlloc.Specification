name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. Multiple components (Specification + Specification.Generator)
          # released as one version — releases_created drives the publish job. The root
          # component "." is ZeroAlloc.Specification and absorbs any path not matched by a
          # more specific component, so no commit can release nothing. See docs/releasing.md.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack all packages at the release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::release-please reported a release but produced no version"
            exit 1
          fi
          mkdir -p ./artifacts

          # One version for every package, so the assembly stamped by the build step above is
          # already correct and pack only has to label the package. It also keeps the bundled
          # copy of the generator and the standalone ZeroAlloc.Specification.Generator package
          # on the same AssemblyVersion, which is what conflict resolution keys on.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" --configuration Release --no-build -p:PackageVersion="$VERSION" -o ./artifacts
          done

          ls -la ./artifacts
          # Releasing nothing while reporting success is the failure mode this guards.
          if ! ls ./artifacts/*.nupkg >/dev/null 2>&1; then
            echo "::error::release-please reported a release but no packages were produced"
            exit 1
          fi

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/ZeroAlloc-Net/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
